name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install documentation dependencies
        run: npm ci

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build documentation guides
        run: npm run docs:build

      - name: Build Dart API reference
        run: dart doc --output docs/.vitepress/dist/api .

      - name: Copy API reference assets
        run: >-
          cp LICENSE
          RFS_SCSS_DART_PARITY.md
          RFS_JS_DART_PARITY.md
          docs/.vitepress/dist/api/

      - name: Build interactive Flutter demo
        working-directory: example
        run: >-
          flutter build web
          --release
          --wasm
          --no-web-resources-cdn
          --base-href /opa_rfs/demo/
          --output ${{ github.workspace }}/docs/.vitepress/dist/demo

      - name: Disable Jekyll processing
        run: touch docs/.vitepress/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
